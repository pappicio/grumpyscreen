
name: branch build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo di compilazione'
        required: true
        type: choice
        options:
          - all
          - mips
          - mips-small
          - rpi
        default: all

      publish:
        description: 'Pubblicare una release GitHub?'
        required: true
        type: boolean
        default: false

  pull_request:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ==========================================
  # BUILD MANUALE E PULL REQUEST
  # ==========================================

  compile:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.build_type == 'mips' && '[{"target":"mips","arch":"mipsel-buildroot-linux-musl-","small":false,"calibrate":false,"asset":"grumpyscreen","build_dir":"build/mips"}]' || inputs.build_type == 'mips-small' && '[{"target":"mips-small","arch":"mipsel-buildroot-linux-musl-","small":true,"calibrate":true,"asset":"grumpyscreen-smallscreen","build_dir":"build/mips-small"}]' || inputs.build_type == 'rpi' && '[{"target":"rpi","arch":"armv8-rpi3-linux-gnueabihf-","small":false,"calibrate":true,"asset":"grumpyscreen-rpi","build_dir":"build/rpi"}]' || '[{"target":"mips","arch":"mipsel-buildroot-linux-musl-","small":false,"calibrate":false,"asset":"grumpyscreen","build_dir":"build/mips"},{"target":"mips-small","arch":"mipsel-buildroot-linux-musl-","small":true,"calibrate":true,"asset":"grumpyscreen-smallscreen","build_dir":"build/mips-small"},{"target":"rpi","arch":"armv8-rpi3-linux-gnueabihf-","small":false,"calibrate":true,"asset":"grumpyscreen-rpi","build_dir":"build/rpi"}]') }}

    container:
      image: pellcorp/grumpydev:latest
      options: --user 1001

    env:
      CROSS_COMPILE: ${{ matrix.arch }}
      CC: ${{ matrix.arch }}
      CXX: ${{ matrix.arch }}
      BUILD_DIR: ${{ matrix.build_dir }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: set grumpyscreen version
      run: |
        BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
        VERSION="v2.0.0-$(git rev-list --count HEAD)"
        echo "GUPPYSCREEN_BRANCH=$BRANCH" >> $GITHUB_ENV
        echo "GUPPYSCREEN_VERSION=$VERSION" >> $GITHUB_ENV
        echo "Building branch $BRANCH, version $VERSION"

    - name: export screen size
      if: matrix.small
      run: |
        echo "GUPPY_SMALL_SCREEN=${{ matrix.small }}" >> $GITHUB_ENV

    - name: export touch calibrate
      if: matrix.calibrate
      run: |
        echo "GUPPY_CALIBRATE=${{ matrix.calibrate }}" >> $GITHUB_ENV

    - name: make wpaclient
      run: make wpaclient

    - name: make libhv
      run: make libhv.a

    - name: make grumpyscreen
      run: make -j

    - name: package release
      run: |
        chmod +x ./release.sh
        ./release.sh grumpyscreen-${{ matrix.target }} ${{ matrix.build_dir }}

    - name: upload compiled package
      uses: actions/upload-artifact@v7
      with:
        name: grumpyscreen-${{ matrix.target }}
        path: ./grumpyscreen-${{ matrix.target }}.tar.gz
        if-no-files-found: error


  # ==========================================
  # BUILD E PUBBLICAZIONE RELEASE
  # ==========================================

  release:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)

    permissions:
      contents: write

    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.build_type == 'mips' && '[{"target":"mips","arch":"mipsel-buildroot-linux-musl-","small":false,"calibrate":false,"asset":"grumpyscreen","build_dir":"build/mips"}]' || inputs.build_type == 'mips-small' && '[{"target":"mips-small","arch":"mipsel-buildroot-linux-musl-","small":true,"calibrate":true,"asset":"grumpyscreen-smallscreen","build_dir":"build/mips-small"}]' || inputs.build_type == 'rpi' && '[{"target":"rpi","arch":"armv8-rpi3-linux-gnueabihf-","small":false,"calibrate":true,"asset":"grumpyscreen-rpi","build_dir":"build/rpi"}]' || '[{"target":"mips","arch":"mipsel-buildroot-linux-musl-","small":false,"calibrate":false,"asset":"grumpyscreen","build_dir":"build/mips"},{"target":"mips-small","arch":"mipsel-buildroot-linux-musl-","small":true,"calibrate":true,"asset":"grumpyscreen-smallscreen","build_dir":"build/mips-small"},{"target":"rpi","arch":"armv8-rpi3-linux-gnueabihf-","small":false,"calibrate":true,"asset":"grumpyscreen-rpi","build_dir":"build/rpi"}]') }}

    container:
      image: pellcorp/grumpydev:latest
      options: --user 1001

    env:
      CROSS_COMPILE: ${{ matrix.arch }}
      CC: ${{ matrix.arch }}
      CXX: ${{ matrix.arch }}
      BUILD_DIR: ${{ matrix.build_dir }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: set grumpyscreen version
      run: |
        BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
        VERSION="v2.0.0-$(git rev-list --count HEAD)"
        echo "GUPPYSCREEN_BRANCH=$BRANCH" >> $GITHUB_ENV
        echo "GUPPYSCREEN_VERSION=$VERSION" >> $GITHUB_ENV
        echo "Building branch $BRANCH, version $VERSION"

    - name: export screen size
      if: matrix.small
      run: |
        echo "GUPPY_SMALL_SCREEN=${{ matrix.small }}" >> $GITHUB_ENV

    - name: export touch calibrate
      if: matrix.calibrate
      run: |
        echo "GUPPY_CALIBRATE=${{ matrix.calibrate }}" >> $GITHUB_ENV

    - name: make wpaclient
      run: make wpaclient

    - name: make libhv
      run: make libhv.a

    - name: make grumpyscreen
      run: make -j

    - name: package release
      run: |
        chmod +x ./release.sh
        ./release.sh ${{ matrix.asset }} ${{ matrix.build_dir }}

    - name: upload release package
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.asset }}
        path: ./${{ matrix.asset }}.tar.gz
        if-no-files-found: error

    - name: branch release
      uses: softprops/action-gh-release@v3
      with:
        name: ${{ github.ref_name }}
        tag_name: ${{ github.ref_name }}
        files: |
          ${{ matrix.asset }}.tar.gz
        fail_on_unmatched_files: true


  # ==========================================
  # ZIP RELEASE PER MOONRAKER
  # ==========================================

  zip-release:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.build_type == 'all')

    needs: release

    permissions:
      contents: write

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: actions/download-artifact@v7
      with:
        path: artifacts

    - name: package zips
      run: |
        VERSION="v2.0.0-$(git rev-list --count HEAD)"
        echo "VERSION=$VERSION" >> $GITHUB_ENV

        for asset in grumpyscreen grumpyscreen-smallscreen grumpyscreen-rpi; do
          mkdir -p "unpack/$asset"
          tar xzf "artifacts/$asset/$asset.tar.gz" -C "unpack/$asset"
          cd "unpack/$asset/grumpyscreen"

          printf '{"project_name": "grumpyscreen", "project_owner": "pellcorp", "version": "%s", "asset_name": "%s.zip"}\n' "$VERSION" "$asset" > release_info.json

          zip -r "$GITHUB_WORKSPACE/$asset.zip" .

          cd "$GITHUB_WORKSPACE"
        done

    - name: versioned release
      uses: softprops/action-gh-release@v3
      with:
        name: ${{ env.VERSION }}
        tag_name: ${{ env.VERSION }}
        target_commitish: ${{ github.sha }}
        make_latest: true
        generate_release_notes: true
        files: |
          grumpyscreen.zip
          grumpyscreen-smallscreen.zip
          grumpyscreen-rpi.zip
        fail_on_unmatched_files: true
